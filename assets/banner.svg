<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Dernier — segnapunti per partite a carte">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2318"/>
      <stop offset="0.55" stop-color="#0B1A12"/>
      <stop offset="1" stop-color="#06110C"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#1DB954" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0B1A12" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldSweep" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#A8791F"/>
      <stop offset="0.5" stop-color="#F7E08A"/>
      <stop offset="1" stop-color="#A8791F"/>
      <animate attributeName="x1" values="-1;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- panno del tavolo -->
  <rect width="1200" height="380" fill="url(#felt)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>
  <ellipse cx="600" cy="500" rx="780" ry="190" fill="#12321F" opacity="0.5"/>

  <!-- titolo -->
  <text x="72" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold"
        letter-spacing="4" fill="url(#goldSweep)">DERNIER</text>
  <text x="76" y="226" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"
        fill="#A9BFB2">Segnapunti da tavolo · chi paga meno, vince</text>
  <rect x="76" y="246" width="130" height="3" rx="1.5" fill="#D4AF37" opacity="0.85"/>

  <!-- mano di cinque carte -->
  <g transform="translate(700 200) rotate(-30)" filter="url(#drop)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4.6s" begin="0s" repeatCount="indefinite"/>
      <rect x="-50" y="-72.5" width="100" height="145" rx="12" fill="#F7F3E8" stroke="#D4AF37" stroke-width="1.3"/>
      <g fill="#14181C" font-family="Georgia, 'Times New Roman', serif">
        <text x="-36" y="-42" font-size="27" font-weight="bold">A</text>
        <text x="-36" y="-18" font-size="21">♠</text>
        <text x="0" y="20" text-anchor="middle" font-size="44">♠</text>
        <g transform="rotate(180)">
          <text x="-36" y="-42" font-size="27" font-weight="bold">A</text>
          <text x="-36" y="-18" font-size="21">♠</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(795 200) rotate(-15)" filter="url(#drop)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4.6s" begin="0.5s" repeatCount="indefinite"/>
      <rect x="-50" y="-72.5" width="100" height="145" rx="12" fill="#F7F3E8" stroke="#D4AF37" stroke-width="1.3"/>
      <g fill="#C1272D" font-family="Georgia, 'Times New Roman', serif">
        <text x="-36" y="-42" font-size="27" font-weight="bold">K</text>
        <text x="-36" y="-18" font-size="21">♥</text>
        <text x="0" y="20" text-anchor="middle" font-size="44">♥</text>
        <g transform="rotate(180)">
          <text x="-36" y="-42" font-size="27" font-weight="bold">K</text>
          <text x="-36" y="-18" font-size="21">♥</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(890 200) rotate(0)" filter="url(#drop)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4.6s" begin="1s" repeatCount="indefinite"/>
      <rect x="-50" y="-72.5" width="100" height="145" rx="12" fill="#F7F3E8" stroke="#D4AF37" stroke-width="1.3"/>
      <g fill="#C1272D" font-family="Georgia, 'Times New Roman', serif">
        <text x="-36" y="-42" font-size="27" font-weight="bold">Q</text>
        <text x="-36" y="-18" font-size="21">♦</text>
        <text x="0" y="20" text-anchor="middle" font-size="44">♦</text>
        <g transform="rotate(180)">
          <text x="-36" y="-42" font-size="27" font-weight="bold">Q</text>
          <text x="-36" y="-18" font-size="21">♦</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(985 200) rotate(15)" filter="url(#drop)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4.6s" begin="1.5s" repeatCount="indefinite"/>
      <rect x="-50" y="-72.5" width="100" height="145" rx="12" fill="#F7F3E8" stroke="#D4AF37" stroke-width="1.3"/>
      <g fill="#14181C" font-family="Georgia, 'Times New Roman', serif">
        <text x="-36" y="-42" font-size="27" font-weight="bold">J</text>
        <text x="-36" y="-18" font-size="21">♣</text>
        <text x="0" y="20" text-anchor="middle" font-size="44">♣</text>
        <g transform="rotate(180)">
          <text x="-36" y="-42" font-size="27" font-weight="bold">J</text>
          <text x="-36" y="-18" font-size="21">♣</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(1080 200) rotate(30)" filter="url(#drop)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4.6s" begin="2s" repeatCount="indefinite"/>
      <rect x="-50" y="-72.5" width="100" height="145" rx="12" fill="#F7F3E8" stroke="#D4AF37" stroke-width="1.3"/>
      <g fill="#14181C" font-family="Georgia, 'Times New Roman', serif">
        <text x="-40" y="-42" font-size="23" font-weight="bold">10</text>
        <text x="-36" y="-18" font-size="21">♠</text>
        <text x="0" y="20" text-anchor="middle" font-size="44">♠</text>
        <g transform="rotate(180)">
          <text x="-40" y="-42" font-size="23" font-weight="bold">10</text>
          <text x="-36" y="-18" font-size="21">♠</text>
        </g>
      </g>
    </g>
  </g>

  <!-- semi che salgono -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="26">
    <g transform="translate(150 340)" opacity="0" fill="#D4AF37">
      <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -95" dur="6s" begin="0s" repeatCount="indefinite" additive="sum"/>
      <text>♦</text>
    </g>
    <g transform="translate(300 355)" opacity="0" fill="#1DB954">
      <animate attributeName="opacity" values="0;0.45;0" dur="7s" begin="1.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -110" dur="7s" begin="1.2s" repeatCount="indefinite" additive="sum"/>
      <text>♣</text>
    </g>
    <g transform="translate(120 260)" opacity="0" fill="#A9BFB2">
      <animate attributeName="opacity" values="0;0.4;0" dur="8s" begin="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -85" dur="8s" begin="2.4s" repeatCount="indefinite" additive="sum"/>
      <text>♠</text>
    </g>
    <g transform="translate(520 350)" opacity="0" fill="#D4AF37">
      <animate attributeName="opacity" values="0;0.45;0" dur="7.5s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -100" dur="7.5s" begin="0.8s" repeatCount="indefinite" additive="sum"/>
      <text>♥</text>
    </g>
    <g transform="translate(600 300)" opacity="0" fill="#1DB954">
      <animate attributeName="opacity" values="0;0.35;0" dur="9s" begin="3.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -90" dur="9s" begin="3.6s" repeatCount="indefinite" additive="sum"/>
      <text>♦</text>
    </g>
    <g transform="translate(240 200)" opacity="0" fill="#D4AF37">
      <animate attributeName="opacity" values="0;0.4;0" dur="6.5s" begin="4.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -80" dur="6.5s" begin="4.4s" repeatCount="indefinite" additive="sum"/>
      <text>♣</text>
    </g>
  </g>

  <!-- bordo dorato inferiore -->
  <rect x="0" y="376" width="1200" height="4" fill="url(#hairline)"/>
</svg>
